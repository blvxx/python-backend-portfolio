groups:
  - name: telegram-business-assistant-availability
    rules:
      - alert: TelegramAssistantMetricsTargetDown
        expr: up{job="telegram-business-assistant"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Telegram Assistant metrics endpoint is unavailable"
          description: "Prometheus has failed to scrape the bot metrics endpoint for at least two minutes."

      - alert: TelegramAssistantDependenciesNotReady
        expr: telegram_app_readiness == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Telegram Assistant database or Redis dependency is not ready"
          description: "The application readiness probe cannot reach one or more required dependencies."

  - name: telegram-business-assistant-outbox
    rules:
      - alert: TelegramAssistantDeadLetterEvents
        expr: telegram_outbox_dead > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Notification outbox contains dead-letter events"
          description: "Review dead-letter notification events and the associated Telegram delivery failure."

      - alert: TelegramAssistantOutboxBacklog
        expr: telegram_outbox_pending > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Notification outbox backlog is elevated"
          description: "More than ten notifications have remained pending for at least five minutes."

      - alert: TelegramAssistantOutboxStalled
        expr: telegram_outbox_pending > 0 and sum(increase(telegram_outbox_delivery_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Notification outbox has stopped making progress"
          description: "Pending notifications exist but no delivery outcome has been recorded during the last ten minutes."
