name: AI Business Assistant Prototype CI

on:
  push:
    paths:
      - "ai-business-assistant-product/**"
  pull_request:
    paths:
      - "ai-business-assistant-product/**"
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business-assistant-product/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q .
      - name: Run API tests
        run: pytest -q
