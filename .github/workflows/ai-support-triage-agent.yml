name: AI Support Triage Agent

on:
  push:
    paths:
      - "ai-support-triage-agent/**"
      - ".github/workflows/ai-support-triage-agent.yml"
  pull_request:
    paths:
      - "ai-support-triage-agent/**"
      - ".github/workflows/ai-support-triage-agent.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-support-triage-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-support-triage-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint source and tests
        run: ruff check src tests evals
      - name: Run offline tests
        run: pytest -q
      - name: Verify CLI entry point
        run: python -m src.cli --help
