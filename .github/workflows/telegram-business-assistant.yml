name: Telegram Business Assistant

on:
  push:
    paths:
      - "telegram-business-assistant/**"
      - ".github/workflows/telegram-business-assistant.yml"
  pull_request:
    paths:
      - "telegram-business-assistant/**"
      - ".github/workflows/telegram-business-assistant.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-business-assistant
    env:
      DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-business-assistant/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python sources
        run: ruff check src tests
      - name: Run unit and service integration tests
        run: pytest -q
      - name: Verify PostgreSQL backup/restore scripts
        working-directory: telegram-business-assistant
        env:
          PGPASSWORD: assistant
          DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS backup_verification (
              id INTEGER PRIMARY KEY,
              value TEXT NOT NULL
            );
            INSERT INTO backup_verification(id, value)
            VALUES (1, 'backup-ok')
            ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
          "
          sh scripts/backup_postgres.sh /tmp/assistant-backup.dump
          createdb -h localhost -U assistant restore_test
          RESTORE_TARGET_DATABASE_URL=postgresql://assistant:assistant@localhost:5432/restore_test \
            RESTORE_CONFIRM=I_UNDERSTAND_THIS_REPLACES_DATA \
            sh scripts/restore_postgres.sh /tmp/assistant-backup.dump
          restored=$(psql postgresql://assistant:assistant@localhost:5432/restore_test -Atc \
            "SELECT value FROM backup_verification WHERE id = 1")
          test "$restored" = "backup-ok"
      - name: Validate Prometheus scrape config and alert rules
        working-directory: telegram-business-assistant
        run: |
          docker run --rm \
            --volume "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.0.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --volume "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.0.1 \
            check rules /etc/prometheus/alerts.yml
      - name: Build Docker image
        run: docker build -t telegram-business-assistant:test .
